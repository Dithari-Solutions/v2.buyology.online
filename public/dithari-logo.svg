<!--
  PLACEHOLDER — replace this file with Dithari's real logo, keeping the filename.

  It is referenced by components/footer/Footer.tsx ("Powered by Dithari"). Overwriting this file is
  the whole handover; no code needs to change.

  Two constraints on the replacement, both learned the hard way from the footer:

  1. It must be LIGHT / knockout. The footer band is a fixed dark gradient (#402f75 -> #2b1f52) in
     BOTH light and dark themes, so a dark-ink logo is invisible there. The footer loads this file
     through <img>, and an <img> SVG cannot inherit currentColor (it falls back to black), so the
     artwork must carry its own light colour, as this placeholder's white fill does.
  2. Keep it an SVG, and keep the viewBox tight around the artwork (update the width/height in
     Footer.tsx to match): empty space in the viewBox widens the image box and pushes the credit
     off-centre. It is rendered with `unoptimized` because SVG is already resolution-independent and
     Next refuses to run SVGs through the image optimizer without dangerouslyAllowSVG, which is not
     worth enabling for one asset.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 24" width="64" height="24" role="img" aria-label="Dithari">
  <text x="0" y="17.5" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">Dithari</text>
</svg>
